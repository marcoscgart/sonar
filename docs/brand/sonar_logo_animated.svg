<svg viewBox="0 0 540 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <style>
    /* Pulso concêntrico a partir do centro de cada círculo */
    .pulse-circle {
      transform-box: fill-box;
      transform-origin: center;
    }

    /* 
      Ciclo de Sonar Real (4.2s no total):
      - 0% a 12%: sobe rapidamente para escala 1.12 (+12%)
      - 12% a 24%: retorna suavemente para escala 1.0
      - 24% a 100%: FICA COMPLETAMENTE ESTÁTICO (pausa de 3.2s de escuta acústica)
    */
    @keyframes sonarPingSweep {
      0% {
        transform: scale(1);
        opacity: 0.88;
      }
      12% {
        transform: scale(1.12);
        opacity: 1;
        filter: drop-shadow(0 0 7px currentColor);
      }
      24% {
        transform: scale(1);
        opacity: 0.88;
      }
      100% {
        transform: scale(1);
        opacity: 0.88;
      }
    }

    .col-1 { animation: sonarPingSweep 4.2s infinite ease-in-out; animation-delay: 0.0s; }
    .col-2 { animation: sonarPingSweep 4.2s infinite ease-in-out; animation-delay: 0.15s; }
    .col-3 { animation: sonarPingSweep 4.2s infinite ease-in-out; animation-delay: 0.30s; }
    .col-4 { animation: sonarPingSweep 4.2s infinite ease-in-out; animation-delay: 0.45s; }
    .col-5 { animation: sonarPingSweep 4.2s infinite ease-in-out; animation-delay: 0.60s; }
    .col-6 { animation: sonarPingSweep 4.2s infinite ease-in-out; animation-delay: 0.75s; }
  </style>

  <defs>
    <!-- Filtro de Halos Fosforescentes Suaves -->
    <filter id="sonarGlowStandalone" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Fundo Preto Marinho Abissal -->
  <rect width="100%" height="100%" rx="16" fill="#030712" />

  <!-- SÍMBOLO: DISPERSÃO DO RASCUNHO (100% FLAT) -->
  <g filter="url(#sonarGlowStandalone)">
    
    <!-- Coluna 1: Origem Azul Ciano (Baixa reflexão / Oceano) -->
    <circle cx="35" cy="90" r="6" fill="#00d4ff" class="pulse-circle col-1" style="color: #00d4ff;" />

    <!-- Coluna 2: Pulso Inicial -->
    <circle cx="65" cy="90" r="8.5" fill="#00e5ff" class="pulse-circle col-2" style="color: #00e5ff;" />

    <!-- Coluna 3: Transição Azul -> Verde-Água -->
    <circle cx="98" cy="45" r="5" fill="#00d4ff" opacity="0.75" class="pulse-circle col-3" style="color: #00d4ff;" />
    <circle cx="98" cy="68" r="7" fill="#00f5d4" class="pulse-circle col-3" style="color: #00f5d4;" />
    <circle cx="98" cy="90" r="11" fill="#05f1cd" class="pulse-circle col-3" style="color: #05f1cd;" />
    <circle cx="98" cy="112" r="7" fill="#00f5d4" class="pulse-circle col-3" style="color: #00f5d4;" />
    <circle cx="98" cy="135" r="5" fill="#00d4ff" opacity="0.75" class="pulse-circle col-3" style="color: #00d4ff;" />

    <!-- Coluna 4: Verde Sonar -> Lima (Frequência Média) -->
    <circle cx="136" cy="32" r="7" fill="#10b981" opacity="0.8" class="pulse-circle col-4" style="color: #10b981;" />
    <circle cx="136" cy="59" r="9" fill="#22c55e" class="pulse-circle col-4" style="color: #22c55e;" />
    <circle cx="136" cy="90" r="13.5" fill="#84cc16" class="pulse-circle col-4" style="color: #84cc16;" />
    <circle cx="136" cy="121" r="9" fill="#22c55e" class="pulse-circle col-4" style="color: #22c55e;" />
    <circle cx="136" cy="148" r="7" fill="#10b981" opacity="0.8" class="pulse-circle col-4" style="color: #10b981;" />

    <!-- Coluna 5: Amarelo -> Laranja (Aquecimento Acústico) -->
    <circle cx="178" cy="25" r="9.5" fill="#eab308" class="pulse-circle col-5" style="color: #eab308;" />
    <circle cx="178" cy="55" r="11.5" fill="#f59e0b" class="pulse-circle col-5" style="color: #f59e0b;" />
    <circle cx="178" cy="90" r="14.5" fill="#f97316" class="pulse-circle col-5" style="color: #f97316;" />
    <circle cx="178" cy="125" r="11.5" fill="#f59e0b" class="pulse-circle col-5" style="color: #f59e0b;" />
    <circle cx="178" cy="155" r="9.5" fill="#eab308" class="pulse-circle col-5" style="color: #eab308;" />

    <!-- Coluna 6: Arco Laranja Externo -->
    <circle cx="224" cy="38" r="12" fill="#ea580c" class="pulse-circle col-6" style="color: #ea580c;" />
    <circle cx="224" cy="142" r="12" fill="#ea580c" class="pulse-circle col-6" style="color: #ea580c;" />

    <!-- Coluna 7: O GRANDE NÓ FOCAL VERMELHO 100% FLAT -->
    <circle cx="230" cy="90" r="25" fill="#ff2a2a" class="pulse-circle col-6" style="color: #ff2a2a;" />
  </g>

  <!-- TIPOGRAFIA DO LOGO -->
  <text x="296" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" letter-spacing="4" fill="#ffffff">
    SONAR
  </text>
  <text x="298" y="118" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" letter-spacing="3" fill="#ff3b30">
    MUSIC DISCOVERY
  </text>
</svg>
